name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttihp27a
        with:
          pdk: ihp-sg13cmos5l # or ihp-sg13g2

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttihp27a

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttihp27a

  # Single Pages deployment: spec site at the root, TinyTapeout viewer at /gds/.
  # Runs even if GDS fails so the specs always publish.
  viewer:
    needs: gds
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Build spec site
        run: |
          pip install -r docs/requirements.txt
          mkdocs build --strict

      - name: Download GDS artifact
        if: needs.gds.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: tt_submission
          path: tt_submission

      - name: Download gds_render artifact
        if: needs.gds.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: gds_render
          path: site/gds

      - name: Add TinyTapeout viewer
        if: needs.gds.result == 'success'
        run: |
          PDK=$(jq -r '.PDK' tt_submission/pdk.json)
          cp tt_submission/*.gds site/gds/tinytapeout.gds
          cp tt_submission/*.oas site/gds/tinytapeout.oas
          cat > site/gds/index.html <<HTML
          <!DOCTYPE html>
          <html lang="en"><head><meta charset="UTF-8"><title>Redirecting to 3D Viewer...</title></head>
          <body><script>
            location.href = "https://gds-viewer.tinytapeout.com/?pdk=${PDK}&model=" + encodeURIComponent(new URL('tinytapeout.oas', location.href).href);
          </script></body></html>
          HTML
          echo "PDK=$PDK" >> "$GITHUB_ENV"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Viewer links
        if: needs.gds.result == 'success'
        run: |
          URL="${{ steps.deployment.outputs.page_url }}"; URL="${URL%/}/gds"
          cat >> "$GITHUB_STEP_SUMMARY" <<MD
          # 3D Viewer
          [Open 3D viewer](https://gds-viewer.tinytapeout.com/?model=$URL/tinytapeout.oas&pdk=$PDK)

          # Tiny Tapeout Explorer
          [Open in Tiny Tapeout Explorer](https://gds-explorer.tinytapeout.com/viewer?file=$URL/tinytapeout.oas&pdk=$PDK)

          # 2D Preview
          ![png]($URL/gds_render.png)
          MD
